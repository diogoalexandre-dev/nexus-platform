<!-- Ilustracao provisoria do hero.
     Para usar uma FOTO real: salve o PNG sem fundo como "jovem.png" nesta pasta
     e troque o src no index.html (a marcacao ja esta pronta). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470"
     role="img" aria-label="Ilustracao de um jovem empreendedor sorrindo">
  <defs>
    <linearGradient id="camisa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ce048"/>
      <stop offset="100%" stop-color="#4fb31f"/>
    </linearGradient>
    <linearGradient id="pele" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8794d"/>
      <stop offset="100%" stop-color="#96603a"/>
    </linearGradient>
  </defs>

  <!-- tronco / camiseta -->
  <path d="M40 470V420c0-52 38-88 88-99l52-12 52 12c50 11 88 47 88 99v50z" fill="url(#camisa)"/>
  <!-- gola -->
  <path d="M152 311c8 20 20 30 28 30s20-10 28-30l-28-8z" fill="#3d8f18"/>
  <!-- braco cruzado, dando dinamica -->
  <path d="M74 470c-4-38 14-64 44-74l30-9 8 26-28 12c-16 7-24 22-22 45z" fill="#4fb31f"/>

  <!-- pescoco -->
  <rect x="158" y="268" width="44" height="56" rx="20" fill="#96603a"/>
  <!-- orelhas -->
  <circle cx="106" cy="212" r="15" fill="url(#pele)"/>
  <circle cx="254" cy="212" r="15" fill="url(#pele)"/>
  <!-- rosto -->
  <ellipse cx="180" cy="196" rx="74" ry="84" fill="url(#pele)"/>
  <!-- cabelo crespo -->
  <g fill="#1f1a16">
    <circle cx="180" cy="112" r="46"/>
    <circle cx="128" cy="132" r="38"/>
    <circle cx="232" cy="132" r="38"/>
    <circle cx="106" cy="170" r="26"/>
    <circle cx="254" cy="170" r="26"/>
    <circle cx="152" cy="100" r="30"/>
    <circle cx="208" cy="100" r="30"/>
  </g>
  <!-- sobrancelhas -->
  <path d="M142 176q14-10 28-2M190 174q14-8 28 2" stroke="#1f1a16" stroke-width="7"
        stroke-linecap="round" fill="none"/>
  <!-- olhos -->
  <circle cx="154" cy="198" r="7" fill="#1f1a16"/>
  <circle cx="206" cy="198" r="7" fill="#1f1a16"/>
  <!-- sorriso -->
  <path d="M148 230q32 34 64 0" stroke="#1f1a16" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
